[package]
name = "retro_os"
version = "0.1.0"
edition = "2024"
authors = ["RetroOS Team"]
description = "A lightweight Linux-like OS with retro Mac OS UI, supporting Linux programs natively and WebAssembly"
license = "MIT"
readme = "../README.md"

# Multi-platform support: x86_64, x86, ARM, RISC-V
[dependencies]
# Core system libraries
libc = "0.2"
nix = { version = "0.29", features = ["process", "fs", "user", "signal"] }

# For future WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "CanvasRenderingContext2d"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Async runtime for concurrent process management
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Terminal UI for retro interface
crossterm = "0.28"

# Future: Windows compatibility layer (Wine-like)
# wine-support = { version = "0.1", optional = true }

[features]
default = ["native"]
native = []
wasm = ["wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook"]

[[bin]]
name = "retro_os"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
